[package]
name = "supremacy"
version = "0.1.0"
edition = "2021"
description = "Rust rewrite of reverse-engineered routines from Supremacy: Your Will Be Done (Probe Software, 1991) GAME.EXE"
publish = false

[dependencies]
cpal = { version = "0.18", optional = true }
minifb = { version = "0.28", optional = true }
oplon = "1"

[features]
minifb = ["dep:minifb"]
audio = ["dep:cpal"]

[[bin]]
name = "supremacy-run"
path = "src/bin/run.rs"
required-features = ["minifb", "audio"]

[[bin]]
name = "supremacy-smoke"
path = "src/bin/smoke.rs"

[[bin]]
name = "extract-img"
path = "src/bin/extract_img.rs"
